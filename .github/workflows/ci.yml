name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  qa:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: symsvel_ci
          POSTGRES_PASSWORD: symsvel_ci_only
          POSTGRES_DB: symsvel_rollback_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U symsvel_ci -d symsvel_rollback_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
      - name: Validate Composer manifest
        run: composer validate --no-check-publish --no-check-lock
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Lint PHP files
        run: find src tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: PostgreSQL client tools
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: PHPUnit
        env:
          SYMSVEL_TEST_POSTGRES_URL: postgresql://symsvel_ci:symsvel_ci_only@127.0.0.1:5432/symsvel_rollback_ci
        run: vendor/bin/phpunit --display-warnings
