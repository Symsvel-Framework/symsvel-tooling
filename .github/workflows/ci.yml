name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main, dev]

# Each GitHub-hosted job has isolated PostgreSQL, MySQL and MariaDB services.
# Cancel superseded runs for the same branch or PR.
concurrency:
  group: tooling-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: symsvel_ci
          POSTGRES_PASSWORD: symsvel_ci_only
          POSTGRES_DB: symsvel_rollback_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U symsvel_ci -d symsvel_rollback_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: symsvel_ci_only
          MYSQL_DATABASE: symsvel_rollback_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -psymsvel_ci_only"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: symsvel_ci_only
          MARIADB_DATABASE: symsvel_rollback_ci
        ports:
          - 3307:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, pdo_pgsql, pdo_mysql, pgsql, intl, sodium
          tools: composer:v2
          coverage: none
      - name: Install PostgreSQL 17 and MySQL/MariaDB clients
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y curl ca-certificates gnupg default-mysql-client
          sudo install -d -m 0755 /usr/share/postgresql-common/pgdg
          key_file="$(mktemp)"
          trap 'rm -f "$key_file"' EXIT
          curl --fail --show-error --silent --location --retry 5 --retry-all-errors --retry-delay 3 \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc --output "$key_file"
          gpg --batch --show-keys "$key_file" > /dev/null
          sudo install -m 0644 "$key_file" /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -o Acquire::Retries=5 -qq
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - name: Verify PHP 8.4 and PostgreSQL/MySQL clients
        run: |
          php -v
          php -r 'if (PHP_VERSION_ID < 80400 || PHP_VERSION_ID >= 80500) { exit(1); }'
          composer --version
          pg_dump --version
          mysql --version
          mysqldump --version
      - name: Validate Composer manifest
        run: composer validate --no-check-publish --no-check-lock
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Audit resolved dependencies
        run: composer audit --locked
      - name: Lint PHP files
        run: find src tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Reset dedicated PostgreSQL test database
        env:
          PGPASSWORD: symsvel_ci_only
        run: |
          test -n "$PGPASSWORD"
          pg_isready -h 127.0.0.1 -U symsvel_ci -d postgres
          dropdb --if-exists --force -h 127.0.0.1 -U symsvel_ci symsvel_rollback_ci
          createdb -h 127.0.0.1 -U symsvel_ci symsvel_rollback_ci
      - name: Configure mysqldump for MySQL and MariaDB compatibility
        run: |
          printf '[mysqldump]\ncolumn-statistics=0\n' > "$HOME/.my.cnf"
          chmod 0600 "$HOME/.my.cnf"
      - name: PHPUnit
        env:
          SYMSVEL_CI_POSTGRES_PASSWORD: symsvel_ci_only
        run: |
          export SYMSVEL_TEST_POSTGRES_URL="$(php -r 'echo "postgresql://symsvel_ci:".rawurlencode(getenv("SYMSVEL_CI_POSTGRES_PASSWORD"))."@127.0.0.1:5432/symsvel_rollback_ci";')"
          export SYMSVEL_TEST_MYSQL_URL="$(php -r 'echo "mysql://root:".rawurlencode(getenv("SYMSVEL_CI_POSTGRES_PASSWORD"))."@127.0.0.1:3306/symsvel_rollback_ci";')"
          export SYMSVEL_TEST_MARIADB_URL="$(php -r 'echo "mariadb://root:".rawurlencode(getenv("SYMSVEL_CI_POSTGRES_PASSWORD"))."@127.0.0.1:3307/symsvel_rollback_ci";')"
          mysql --host=127.0.0.1 --port=3306 --protocol=tcp --user=root --password="$SYMSVEL_CI_POSTGRES_PASSWORD" --execute='SELECT 1' symsvel_rollback_ci
          mysql --host=127.0.0.1 --port=3307 --protocol=tcp --user=root --password="$SYMSVEL_CI_POSTGRES_PASSWORD" --execute='SELECT 1' symsvel_rollback_ci
          vendor/bin/phpunit --display-warnings --display-skipped --fail-on-warning

  documentation-navigation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, sodium
          tools: composer:v2
          coverage: none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Build real local MkDocs site
        run: php tests/Fixtures/build-documentation-site.php "$RUNNER_TEMP/symsvel-docs"
      - name: Install Chromium for navigation regression test
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Verify accordion, page anchors and project guides in local HTML
        run: python tests/Fixtures/check-documentation-navigation.py "$RUNNER_TEMP/symsvel-docs"

  windows-documentation:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, sodium
          tools: composer:v2
          coverage: none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: composer install --no-interaction --prefer-dist --no-progress
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build real local MkDocs site on Windows
        run: php tests/Fixtures/build-documentation-site.php "$env:RUNNER_TEMP/symsvel docs"
      - name: Verify native Composer and npm processes
        run: php tests/Fixtures/check-windows-processes.php "$env:RUNNER_TEMP/symsvel docs"
      - name: Verify native Git clone and npm component installation
        run: php tests/Fixtures/check-windows-component-install.php "$env:RUNNER_TEMP/symsvel docs"
      - name: Verify Windows source and runtime rollback
        run: php tests/Fixtures/check-windows-transactions.php "$env:RUNNER_TEMP/symsvel docs"
      - name: Rebuild and verify dependency cache
        run: php tests/Fixtures/check-windows-documentation.php "$env:RUNNER_TEMP/symsvel docs"
      - name: Install Chromium
        run: |
          python -m pip install playwright
          python -m playwright install chromium
      - name: Verify local navigation
        run: python tests/Fixtures/check-documentation-navigation.py "$env:RUNNER_TEMP/symsvel docs"
