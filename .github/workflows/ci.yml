name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

# Cost control: superseded runs on the same branch/PR are cancelled.
# Keep PostgreSQL rollback tests and client enabled; DB is supplied by runner Compose.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: [self-hosted, linux, ARM64, symsvel]
    steps:
      - uses: actions/checkout@v5
      - name: Verify preinstalled PHP 8.4 and PostgreSQL 17 client
        run: |
          php -v
          php -r 'if (PHP_VERSION_ID < 80400 || PHP_VERSION_ID >= 80500) { exit(1); }'
          composer --version
          pg_dump --version
      - name: Validate Composer manifest
        run: composer validate --no-check-publish --no-check-lock
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Lint PHP files
        run: find src tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Reset dedicated PostgreSQL test database
        env:
          PGPASSWORD: ${{ secrets.SYMSVEL_CI_POSTGRES_PASSWORD }}
        run: |
          test -n "$PGPASSWORD"
          pg_isready -h postgres -U symsvel_ci -d postgres
          dropdb --if-exists --force -h postgres -U symsvel_ci symsvel_rollback_ci
          createdb -h postgres -U symsvel_ci symsvel_rollback_ci
      - name: PHPUnit
        env:
          SYMSVEL_CI_POSTGRES_PASSWORD: ${{ secrets.SYMSVEL_CI_POSTGRES_PASSWORD }}
        run: |
          export SYMSVEL_TEST_POSTGRES_URL="$(php -r 'echo "postgresql://symsvel_ci:".rawurlencode(getenv("SYMSVEL_CI_POSTGRES_PASSWORD"))."@postgres:5432/symsvel_rollback_ci";')"
          vendor/bin/phpunit --display-warnings --fail-on-warning
